spring.application.name=SwiftTray
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/swifttray}
spring.datasource.username=${DB_USERNAME:swifttray}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
swifttray.admin.email=${SWIFTTRAY_ADMIN_EMAIL:}
swifttray.admin.password=${SWIFTTRAY_ADMIN_PASSWORD:}
